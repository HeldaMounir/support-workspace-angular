<aside
  class="sidebar"
  [class.collapsed]="collapsed"
>

  <!-- Logo -->
  <div class="sidebar-header">

    <div class="logo">

      <div class="logo-icon">
        <span>CS</span>
      </div>

      @if (!collapsed) {

        <div class="logo-text">

          <span class="logo-title">
            Support
          </span>

          <span class="logo-subtitle">
            Workspace
          </span>

        </div>

      }

    </div>


    <!-- Collapse -->
    <button
      type="button"
      class="collapse-btn"
      (click)="toggleSidebar()"
      [attr.aria-label]="
        collapsed
          ? 'Expand sidebar'
          : 'Collapse sidebar'
      "
    >

      @if (collapsed) {

        <lucide-icon
          [img]="ChevronRight"
          [size]="17"
          [strokeWidth]="2"
        ></lucide-icon>

      } @else {

        <lucide-icon
          [img]="ChevronLeft"
          [size]="17"
          [strokeWidth]="2"
        ></lucide-icon>

      }

    </button>

  </div>


  <!-- Navigation -->
  <nav class="sidebar-nav">

    <div class="nav-section">

      @if (!collapsed) {

        <p class="section-title">
          MAIN
        </p>

      }


      <!-- Dashboard -->
      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        class="nav-item"
        [title]="
          collapsed
            ? 'Dashboard'
            : ''
        "
      >

        <lucide-icon
          class="nav-icon"
          [img]="LayoutDashboard"
          [size]="18"
          [strokeWidth]="2"
        ></lucide-icon>


        @if (!collapsed) {

          <span>
            Dashboard
          </span>

        }

      </a>


      <!-- Requests -->
      <a
        routerLink="/requests"
        routerLinkActive="active"
        class="nav-item"
        [title]="
          collapsed
            ? 'Requests'
            : ''
        "
      >

        <lucide-icon
          class="nav-icon"
          [img]="ClipboardList"
          [size]="18"
          [strokeWidth]="2"
        ></lucide-icon>


        @if (!collapsed) {

          <span>
            Requests
          </span>

          <span class="nav-badge">
            12
          </span>

        }

      </a>

    </div>

  </nav>


  <!-- Bottom -->
  <div class="sidebar-bottom">


    <!-- Settings -->
    <a
      routerLink="/settings"
      routerLinkActive="active"
      class="nav-item"
      [title]="
        collapsed
          ? 'Settings'
          : ''
      "
    >

      <lucide-icon
        class="nav-icon"
        [img]="Settings"
        [size]="18"
        [strokeWidth]="2"
      ></lucide-icon>


      @if (!collapsed) {

        <span>
          Settings
        </span>

      }

    </a>


    <!-- Sign out -->
    <button
      type="button"
      class="logout-btn"
      [title]="
        collapsed
          ? 'Sign out'
          : ''
      "
    >

      <lucide-icon
        class="nav-icon"
        [img]="LogOut"
        [size]="18"
        [strokeWidth]="2"
      ></lucide-icon>


      @if (!collapsed) {

        <span>
          Sign out
        </span>

      }

    </button>

  </div>

</aside>
