<header class="navbar">

  <!-- Left -->
  <div class="navbar-left">

    <div class="page-info">
      <span class="page-label">Workspace</span>

      <h1>
        {{ pageTitle }}
      </h1>
    </div>

  </div>


  <!-- Right -->
  <div class="navbar-right">

    <!-- Search -->
    <button
      type="button"
      class="icon-btn search-btn"
      aria-label="Search"
    >
      <lucide-icon
        [img]="Search"
        [size]="18"
        [strokeWidth]="1.8"
      ></lucide-icon>
    </button>


    <!-- Notifications -->
    <button
      type="button"
      class="icon-btn notification-btn"
      aria-label="Notifications"
    >

      <lucide-icon
        [img]="Bell"
        [size]="18"
        [strokeWidth]="1.8"
      ></lucide-icon>

      <span class="notification-dot"></span>

    </button>


    <!-- Divider -->
    <div class="divider"></div>


    <!-- User -->
    <div class="user-profile">

      <div class="avatar">
        HM
      </div>

      <div class="user-info">

        <span class="user-name">
          Helda
        </span>

        <span class="user-role">
          Support Agent
        </span>

      </div>

      <lucide-icon
        class="chevron"
        [img]="ChevronDown"
        [size]="16"
        [strokeWidth]="1.8"
      ></lucide-icon>

    </div>

  </div>

</header>
